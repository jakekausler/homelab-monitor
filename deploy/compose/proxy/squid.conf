# STAGE-009-015: HTTPS forward proxy for fixer-runner egress enforcement.
# Allow-list is loaded from /etc/squid/allowlist.txt (mounted RO).
# Orchestrator rewrites the allow-list per exec and calls `squid -k reconfigure`.

http_port 3128

# Only allow CONNECT (HTTPS) to allow-listed destinations
acl allowed_hosts dstdomain "/etc/squid/allowlist.txt"
acl CONNECT method CONNECT
acl SSL_ports port 443

http_access allow CONNECT allowed_hosts SSL_ports
http_access deny all

# Minimal logging (deny lines are the important audit signal).
# STAGE-009-015: cache_effective_user proxy (image default) can't write to
# /dev/stdout root-owned stdio; use Squid-managed paths inside its writable dir.
access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log

# No caching (proxy is enforcement, not performance)
cache deny all

# Fast reconfigure — no in-flight to preserve; single-flight execs
shutdown_lifetime 0 seconds

# Do not expose our version in denied responses
visible_hostname homelab-fixer-egress-proxy
